# Reusable CI for DDEV-based Drupal projects.
#
# Usage in a project (.github/workflows/ci.yml):
#
#   on:
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     drupal:
#       uses: woldtwerk-websites/renovate-config/.github/workflows/drupal-ci.yml@main
#
# Optional production-DB mode: install from a scrubbed production dump instead
# of config. The shared endpoint receives the project (repository) name as
# SSH_ORIGINAL_COMMAND via its authorized_keys forced command and prints a
# gzipped SQL dump to stdout.
#
#       with:
#         db-ssh-host: dump@db.example.com
#         db-ssh-known-hosts: db.example.com ssh-ed25519 AAAA...
#       secrets:
#         db-snapshot-key: ${{ secrets.DB_SNAPSHOT_KEY }}
#
# Without db-ssh-host (or without the secret, e.g. fork PRs) the site is
# installed from the base branch's config as before.
#
# Optional: let CI commit config changed by update hooks to Renovate PRs. The
# PAT needs contents write access; pushes with GITHUB_TOKEN start no new run.
#
#       secrets:
#         config-push-token: ${{ secrets.CONFIG_PUSH_TOKEN }}
#
# Flow: install the site from the base branch's config, or optionally import a
# scrubbed production database over SSH, switch to the PR head, then composer
# install/audit, drush updb, verify that the config changed by the update hooks
# is exported (on Renovate PRs, push the export), pnpm checks, tests.

name: Drupal CI

on:
  workflow_call:
    inputs:
      frontend-dir:
        description: Directory containing package.json and pnpm-lock.yaml, relative to the repo root (empty = skip pnpm steps)
        type: string
        default: "."
      build-script:
        description: package.json script for the frontend build (empty = skip)
        type: string
        default: build
      test-script:
        description: composer.json script that runs the tests (empty = skip)
        type: string
        default: test
      ddev-skip-configs:
        description: Space-separated .ddev/config.*.yaml files not needed in CI, e.g. ones with dev-only hooks
        type: string
        default: ""
      smoke-paths:
        # Not "/" by default: after site:install the CI site has no content, so
        # a node front page is a 404. A production DB import adds "/" itself.
        description: Space-separated paths that must answer with HTTP 200
        type: string
        default: /user/login
      db-ssh-host:
        description: SSH destination (user@host) of the shared dump endpoint; it receives the repository name as SSH_ORIGINAL_COMMAND and prints a gzipped SQL dump. Empty = install from config
        type: string
        default: ""
      db-ssh-known-hosts:
        description: known_hosts line(s) for db-ssh-host, passed as an input so CI does not depend on how vars reach it
        type: string
        default: ""
    secrets:
      db-snapshot-key:
        description: Private SSH key for db-ssh-host (empty on fork PRs = install from config)
        required: false
      config-push-token:
        description: PAT with contents write access; lets CI push config changed by update hooks to Renovate PRs (empty = fail instead)
        required: false

permissions:
  contents: read

concurrency:
  group: drupal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FRONTEND_DIR: ${{ inputs.frontend-dir }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      TEST_SCRIPT: ${{ inputs.test-script }}
      DDEV_SKIP_CONFIGS: ${{ inputs.ddev-skip-configs }}
      SMOKE_PATHS: ${{ inputs.smoke-paths }}
      DB_SSH_HOST: ${{ inputs.db-ssh-host }}
      DB_SSH_KNOWN_HOSTS: ${{ inputs.db-ssh-known-hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        with:
          autostart: false

      - name: Fetch production database
        # The dump only lives in RUNNER_TEMP: never an artifact, cache or log.
        if: env.DB_SSH_HOST != ''
        env:
          DB_SNAPSHOT_KEY: ${{ secrets.db-snapshot-key }}
        run: |
          if [ -z "$DB_SNAPSHOT_KEY" ] || [ -z "$DB_SSH_KNOWN_HOSTS" ]; then
            echo "::notice::db-ssh-host is set but the key or known_hosts is missing (fork PR or missing secret); installing from config instead."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/db_key"
          known_hosts="$RUNNER_TEMP/db_known_hosts"
          dump="$RUNNER_TEMP/db.sql.gz"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$DB_SNAPSHOT_KEY" > "$key"
          printf '%s\n' "$DB_SSH_KNOWN_HOSTS" > "$known_hosts"
          # By convention the repository name is the project's directory on the server.
          ssh -i "$key" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DB_SSH_HOST" \
            "${GITHUB_REPOSITORY#*/}" > "$dump"
          gzip -t "$dump"
          echo "CI_DB_DUMP=$dump" >> "$GITHUB_ENV"

      - name: Install site from base branch
        run: |
          git checkout --quiet "$BASE_SHA"
          for f in $DDEV_SKIP_CONFIGS; do rm -f ".ddev/$f"; done
          # Not needed in CI: all requests go to http://localhost inside the web container.
          ddev config global --omit-containers=ddev-router,ddev-ssh-agent
          ddev start
          ddev composer install --no-interaction --no-progress
          if [ -n "${CI_DB_DUMP:-}" ]; then
            # Production-like state: import the scrubbed dump, then run update
            # hooks and config import against the base branch code.
            ddev import-db --file="$CI_DB_DUMP"
            rm -f "$CI_DB_DUMP"
            ddev drush deploy --yes
            echo "CI_DB_IMPORTED=1" >> "$GITHUB_ENV"
          else
            # Random throwaway password, so drush doesn't print a generated one to the log.
            ddev drush site:install --existing-config --yes --account-pass="$(openssl rand -hex 16)"
          fi
          # Compare against this snapshot, not the repo: install itself (e.g.
          # translation imports) can make active config differ from the export.
          # Settle derived config (e.g. Canvas regenerates components on rebuild).
          ddev drush cache:rebuild
          mkdir -p .ci-config
          ddev drush config:export --yes --destination=/var/www/html/.ci-config/before

      - name: Switch to PR head
        run: |
          # --force: DDEV post-start hooks (e.g. recipe-unpack) may have touched tracked files.
          git checkout --quiet --force "$HEAD_SHA"
          for f in $DDEV_SKIP_CONFIGS; do rm -f ".ddev/$f"; done
          ddev restart
          ddev composer install --no-interaction --no-progress

      - name: Composer audit
        # ddev exec, not ddev composer: the latter hides stdout when the command fails.
        # Fails only on advisories the PR adds: one that already affects the base
        # branch must not block unrelated PRs (and hold up Renovate automerge).
        run: |
          if ddev exec composer audit --locked --abandoned=report; then
            exit 0
          fi
          mkdir -p .ci-config/audit-base
          git show "$BASE_SHA:composer.json" > .ci-config/audit-base/composer.json
          git show "$BASE_SHA:composer.lock" > .ci-config/audit-base/composer.lock
          # Non-zero exit when advisories are found, so check the JSON instead.
          ddev exec composer audit --locked --format=json > .ci-config/audit-head.json || true
          ddev exec --dir /var/www/html/.ci-config/audit-base composer audit --locked --format=json > .ci-config/audit-base.json || true
          jq -e .advisories .ci-config/audit-head.json .ci-config/audit-base.json > /dev/null
          ids() { jq -r '[.advisories[][]?.advisoryId] | unique | .[]' "$1"; }
          new=$(comm -13 <(ids .ci-config/audit-base.json) <(ids .ci-config/audit-head.json))
          if [ -n "$new" ]; then
            echo "::error::This PR adds packages with security advisories: ${new//$'\n'/ }"
            exit 1
          fi
          echo "::warning::composer audit found advisories that already affect the base branch. Update the affected packages in a separate PR."

      - name: Database updates
        run: |
          ddev drush updatedb --yes
          ddev drush cache:rebuild

      - name: Config changed by update hooks must be exported
        # Production runs `drush deploy` (updb, then config:import), so whatever
        # the update hooks change must already be in the PR's sync directory, or
        # the import reverts it. On Renovate PRs the export is pushed to the PR
        # branch when config-push-token is set; the push starts a new CI run.
        env:
          CONFIG_PUSH_TOKEN: ${{ secrets.config-push-token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          ddev drush config:export --yes --destination=/var/www/html/.ci-config/after
          sync=$(ddev drush php:eval 'echo realpath(\Drupal\Core\Site\Settings::get("config_sync_directory"));')
          sync=${sync#/var/www/html/}
          # Files the update hooks added, changed or removed, relative to the export root.
          changed=$( { (cd .ci-config/before && find . -type f); (cd .ci-config/after && find . -type f); } \
            | sort -u | while IFS= read -r f; do
                cmp -s ".ci-config/before/$f" ".ci-config/after/$f" || echo "$f"
              done )
          stale=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ -f ".ci-config/after/$f" ]; then
              cmp -s ".ci-config/after/$f" "$sync/$f" || stale+=("$f")
            elif [ -e "$sync/$f" ]; then
              stale+=("$f")
            fi
          done <<< "$changed"
          if [ ${#stale[@]} -eq 0 ]; then
            exit 0
          fi
          for f in "${stale[@]}"; do
            diff --unified --new-file "$sync/$f" ".ci-config/after/$f" || true
          done
          if [ "$PR_AUTHOR" != "renovate[bot]" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ -z "$CONFIG_PUSH_TOKEN" ]; then
            echo "::error::Update hooks changed configuration that is not in $sync. Run 'drush updb && drush cex' locally and commit the result."
            exit 1
          fi
          for f in "${stale[@]}"; do
            if [ -f ".ci-config/after/$f" ]; then
              mkdir -p "$(dirname "$sync/$f")"
              cp ".ci-config/after/$f" "$sync/$f"
            else
              rm -f "$sync/$f"
            fi
          done
          git add --all -- "$sync"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "chore: export config changed by update hooks"
          git push "https://x-access-token:${CONFIG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          echo "::notice::Pushed the config changed by update hooks to $HEAD_REF. The new CI run checks the result."
          exit 1

      - name: Pick the frontend container
        if: inputs.frontend-dir != ''
        run: |
          # Sites with the ddev-viteplus addon have no pnpm in the web container.
          if [ -f .ddev/docker-compose.viteplus.yaml ]; then
            echo "FRONTEND_EXEC=ddev exec -s viteplus --dir /app/$FRONTEND_DIR vp" >> "$GITHUB_ENV"
          else
            echo "FRONTEND_EXEC=ddev exec --dir /var/www/html/$FRONTEND_DIR pnpm" >> "$GITHUB_ENV"
          fi

      - name: pnpm install and dedupe check
        if: inputs.frontend-dir != ''
        run: |
          $FRONTEND_EXEC install --frozen-lockfile
          $FRONTEND_EXEC dedupe --check

      - name: Frontend build
        if: inputs.frontend-dir != '' && inputs.build-script != ''
        run: $FRONTEND_EXEC run "$BUILD_SCRIPT"

      - name: Tests
        if: inputs.test-script != ''
        # ddev exec, not ddev composer: the latter hides stdout when the script fails.
        run: ddev exec composer run-script --timeout=0 "$TEST_SCRIPT"

      - name: Smoke test
        run: |
          ddev drush status --field=bootstrap | grep -q Successful
          # A production dump has a front page node, a fresh install does not.
          # Callers cannot pass "/" conditionally: secrets are unavailable in `with:`.
          if [ -n "${CI_DB_IMPORTED:-}" ]; then
            case " $SMOKE_PATHS " in
              *" / "*) ;;
              *) SMOKE_PATHS="/ $SMOKE_PATHS" ;;
            esac
          fi
          for path in $SMOKE_PATHS; do
            echo "GET $path"
            ddev exec curl --fail --silent --show-error --output /dev/null "http://localhost$path"
          done

      - name: Watchdog errors
        if: failure()
        # Numeric severity (3 = error): level names are translated on non-English sites.
        run: ddev drush watchdog:show --severity=3 --count=50 || true
