# Reusable CI for DDEV-based Drupal projects.
#
# Usage in a project (.github/workflows/ci.yml):
#
#   on:
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     drupal:
#       uses: woldtwerk-websites/renovate-config/.github/workflows/drupal-ci.yml@main
#
# Flow: install the site from the base branch's config (no customer data),
# switch to the PR head, then composer install/audit, drush updb, verify that
# the update hooks did not change active config, pnpm checks, tests.

name: Drupal CI

on:
  workflow_call:
    inputs:
      frontend-dir:
        description: Directory containing package.json and pnpm-lock.yaml, relative to the repo root (empty = skip pnpm steps)
        type: string
        default: "."
      build-script:
        description: package.json script for the frontend build (empty = skip)
        type: string
        default: build
      test-script:
        description: composer.json script that runs the tests (empty = skip)
        type: string
        default: test
      ddev-skip-configs:
        description: Space-separated .ddev/config.*.yaml files not needed in CI, e.g. ones with dev-only hooks
        type: string
        default: ""
      smoke-paths:
        # Not "/" by default: the CI site has no content, so a node front page is a 404.
        description: Space-separated paths that must answer with HTTP 200
        type: string
        default: /user/login

permissions:
  contents: read

concurrency:
  group: drupal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FRONTEND_DIR: ${{ inputs.frontend-dir }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      TEST_SCRIPT: ${{ inputs.test-script }}
      DDEV_SKIP_CONFIGS: ${{ inputs.ddev-skip-configs }}
      SMOKE_PATHS: ${{ inputs.smoke-paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        with:
          autostart: false

      - name: Install site from base branch
        run: |
          git checkout --quiet "$BASE_SHA"
          for f in $DDEV_SKIP_CONFIGS; do rm -f ".ddev/$f"; done
          # Not needed in CI: all requests go to http://localhost inside the web container.
          ddev config global --omit-containers=ddev-router,ddev-ssh-agent
          ddev start
          ddev composer install --no-interaction --no-progress
          # Random throwaway password, so drush doesn't print a generated one to the log.
          ddev drush site:install --existing-config --yes --account-pass="$(openssl rand -hex 16)"
          # Compare against this snapshot, not the repo: install itself (e.g.
          # translation imports) can make active config differ from the export.
          # Settle derived config (e.g. Canvas regenerates components on rebuild).
          ddev drush cache:rebuild
          mkdir -p .ci-config
          ddev drush config:export --yes --destination=/var/www/html/.ci-config/before

      - name: Switch to PR head
        run: |
          # --force: DDEV post-start hooks (e.g. recipe-unpack) may have touched tracked files.
          git checkout --quiet --force "$HEAD_SHA"
          for f in $DDEV_SKIP_CONFIGS; do rm -f ".ddev/$f"; done
          ddev restart
          ddev composer install --no-interaction --no-progress

      - name: Composer audit
        run: ddev composer audit --locked --abandoned=report

      - name: Database updates
        run: |
          ddev drush updatedb --yes
          ddev drush cache:rebuild

      - name: Update hooks must not change config
        run: |
          ddev drush config:export --yes --destination=/var/www/html/.ci-config/after
          if ! diff --recursive --unified .ci-config/before .ci-config/after; then
            echo "::error::Update hooks changed configuration. Run 'drush updb && drush cex' locally and commit the result."
            exit 1
          fi

      - name: pnpm install and dedupe check
        if: inputs.frontend-dir != ''
        run: |
          ddev exec --dir "/var/www/html/$FRONTEND_DIR" pnpm install --frozen-lockfile
          ddev exec --dir "/var/www/html/$FRONTEND_DIR" pnpm dedupe --check

      - name: Frontend build
        if: inputs.frontend-dir != '' && inputs.build-script != ''
        run: ddev exec --dir "/var/www/html/$FRONTEND_DIR" pnpm run "$BUILD_SCRIPT"

      - name: Tests
        if: inputs.test-script != ''
        # ddev exec, not ddev composer: the latter hides stdout when the script fails.
        run: ddev exec composer run-script --timeout=0 "$TEST_SCRIPT"

      - name: Smoke test
        run: |
          ddev drush status --field=bootstrap | grep -q Successful
          for path in $SMOKE_PATHS; do
            echo "GET $path"
            ddev exec curl --fail --silent --show-error --output /dev/null "http://localhost$path"
          done

      - name: Watchdog errors
        if: failure()
        # Numeric severity (3 = error): level names are translated on non-English sites.
        run: ddev drush watchdog:show --severity=3 --count=50 || true
